# ===================================================================
#               Shared Parameters for H12 Robot
# ===================================================================
# These parameters are common across different policies.
shared_params:
  # Path to the robot description file
  xml_path: "/home/niraj/isaac_projects/h12_loco_manipulation/h12_rl/legged_gym/resources/robots/h1_2_27dof/scene.xml"

  # Simulation parameters
  simulation_duration: 60.0
  simulation_dt: 0.002
  control_decimation: 10 # Results in 50Hz control frequency (0.002 * 10 = 0.02s)

  # PD gains for arms (identical in both files)
  kps_arms: [150.0,
             200, 200, 150, 150, 150, 50, 50.0,
             200, 200, 150, 150, 150, 50, 50.0]

  kds_arms: [3.0,
             6.0, 6.0, 4.0, 4.0, 4.0, 3.0, 3.0,
             6.0, 6.0, 4.0, 4.0, 4.0, 3.0, 3.0]

  # Default joint angles for arms (identical in both files)
  default_angles_arms: [0.0,
                        0.4, 0.0, 0.0, 0.3, 0.0, 0.0, 0.0,
                        0.4, 0.0, 0.0, 0.3, 0.0, 0.0, 0.0]

  # Leg motor position limits (identical in both files)
  # Joint order: [hip_yaw, hip_pitch, hip_roll, knee, ankle_pitch, ankle_roll] for left then right leg.
  legs_motor_pos_lower_limit_list: [-0.43, -3.14, -0.43, -0.26, -0.897334, -0.261799,
                                    -0.43, -3.14, -3.14, -0.26, -0.897334, -0.261799]

  legs_motor_pos_upper_limit_list: [0.43, 2.5, 3.14, 2.05, 0.523598, 0.261799,
                                    0.43, 2.5, 0.43, 2.05, 0.523598, 0.261799]

  # Scaling factors for observations and actions
  ang_vel_scale: 0.25
  dof_pos_scale: 1.0
  dof_vel_scale: 0.05
  action_scale: 0.25
  cmd_scale: [2.0, 2.0, 0.25]

  # Number of actions is the same for both policies
  num_actions: 12

# ===================================================================
#                 Policy-Specific Parameters
# ===================================================================
# Contains parameters that are unique to each policy (squat, walk).
policies:
  squat:
    policy_path: "/home/niraj/isaac_projects/h12_loco_manipulation/policies/policy_squat.pt"

    # PD gains for legs
    kps_legs: [200, 200, 200, 300, 60, 40,
               200, 200, 200, 300, 60, 40]

    kds_legs: [5.0, 5.0, 5.0, 7.5, 1.0, 0.3,
               5.0, 5.0, 5.0, 7.5, 1.0, 0.3]

    # Default joint angles for legs
    default_angles_legs: [0.0, -0.16, 0.0, 0.36, -0.2, 0.0,
                          0.0, -0.16, 0.0, 0.36, -0.2, 0.0]

    # Observation space dimensions
    num_obs: 456
    obs_history_len: 6

    # Initial commands
    cmd_init: [0.0, 0.0, 0.0]
    height_cmd: 1.00

  walk:
    policy_path: "/home/niraj/isaac_projects/h12_loco_manipulation/policies/policy_walk.pt"

    # PD gains for legs
    kps_legs: [200, 200, 200, 300, 40, 40,
               200, 200, 200, 300, 40, 40]

    kds_legs: [2.5, 2.5, 2.5, 4.0, 2.0, 2.0,
               2.5, 2.5, 2.5, 4.0, 2.0, 2.0]

    # Default joint angles for legs
    default_angles_legs: [0.0, -0.16, 0.0, 0.36, -0.2, 0.0,
                          0.0, -0.16, 0.0, 0.36, -0.2, 0.0]

    # Observation space dimensions
    num_obs: 47
    # obs_history_len is not specified for walk, so it's omitted here.

    # Initial commands
    cmd_init: [0.0, 0.0, 0.5]